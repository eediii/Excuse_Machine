<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bahane Matik (Party Edition)</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            /* DÜZELTME: Burası Fredoka idi, Nunito yaptık */
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* PC (Varsayılan) Ayarları */
        .container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            text-align: center;
            width: 50%;
            max-width: 800px;
            border: 4px solid #fff;
        }

        h1 {
            color: #2c3e50;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0px #eee;
            font-weight: 900; /* Başlık iyice kalın olsun */
        }

        p {
            color: #555;
            font-size: 1.1em;
            margin-bottom: 20px;
            font-weight: 700;
        }

        #reason-box {
            font-size: 1.8em;
            color: #d63031;
            font-weight: 700; /* Kalınlık artırıldı */
            min-height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 10%;
            padding: 20px;
            background-color: #fff0f0;
            border-radius: 20px;
            border: 3px dashed #ff7675;
        }

        .original-text {
            font-size: 0.6em;
            color: #b2bec3;
            font-weight: 400;
            margin-top: 15px;
            font-style: italic;
        }

        button {
            /* DÜZELTME: Burası da Nunito yapıldı */
            font-family: 'Nunito', sans-serif; 
            font-weight: 900; /* Buton yazısı daha dolgun */
            background-color: #ffeaa7;
            color: #d63031; 
            border: none;
            padding: 20px 50px;
            font-size: 1.3em;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 6px 0 #fdcb6e;
            margin: 4vh;
        }

        button:hover {
            transform: scale(1.05) rotate(2deg);
            background-color: #fff200;
        }

        button:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #fdcb6e;
        }

        /* --- TV MODU REVİZE EDİLDİ --- */
        @media screen and (min-width: 1600px) {
            .container {
                width: 50%;       
                max-width: 1100px; 
                padding: 60px;
                border-radius: 50px;
                border-width: 8px;
            }
            h1 { font-size: 4em; margin-bottom: 20px; }
            p { font-size: 1.8em; margin-bottom: 40px; }
            #reason-box {
                font-size: 3em;
                min-height: 300px;
                margin: 40px 0;
                border-width: 5px;
            }
            .original-text { font-size: 0.5em; margin-top: 25px; }
            button {
                font-size: 2.5em;
                padding: 30px 80px;
                box-shadow: 0 10px 0 #fdcb6e;
            }
        }

        /* --- MOBİL MODU --- */
        @media screen and (max-width: 768px) {
            .container { width: 85%; padding: 20px; }
            h1 { font-size: 2em; }
            #reason-box { font-size: 1.3em; transform: none; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🙅‍♂️ Bahanematik</h1>
        <p>Tuşa bas, kurtulmanın yolunu bul!</p>
        
        <div id="reason-box">
            Hazırsan butona bas!
        </div>
        
        <button onclick="bahaneGetir()">Salla Gelsin 🎲</button>
    </div>

    <script>
        async function bahaneGetir() {
            const kutu = document.getElementById('reason-box');
            kutu.innerHTML = "🤔 Düşünüyor...";
            
            try {
                const cevap = await fetch('https://naas.isalman.dev/no');
                const veri = await cevap.json();
                const ingilizceBahane = veri.reason;

                kutu.innerHTML = "🌍 Çeviriyor...";

                const cevirUrl = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(ingilizceBahane)}&langpair=en|tr`;
                
                const cevirCevap = await fetch(cevirUrl);
                const cevirVeri = await cevirCevap.json();
                
                let turkceBahane = cevirVeri.responseData.translatedText;

                kutu.innerHTML = `
                    "${turkceBahane}"
                    <div class="original-text">${ingilizceBahane}</div>
                `;

            } catch (hata) {
                console.error("Hata:", hata);
                kutu.innerText = "Bağlantı koptu, tekrar dene! 🔌";
            }
        }
    </script>

</body>
</html>
